[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracesynth"
version = "0.1.0"
description = "Synthetic tool-use data generation and evaluation for Agentic RAG."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
    "pyyaml",
    "langgraph",
    "langchain-core",
    "pydantic",
    "datasets",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["tracesynth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

