# Different models for different steps
step_models:
  ToolSetGenAgent:
    name: "deepseek-ai/DeepSeek-V4-Flash"
    api_base: "DeepSeek_V4_Flash_ADDRESS_bailian"
    api_key_env: "DeepSeek_V4_Flash_API_KEY_bailian"
#    max_tokens: 10240
#    temperature: 0.9
#    use_thinking: false
    llm_params:
      temperature: 0.9
      max_completion_tokens: 8192
      reasoning_effort: "xhigh"
      top_p: 0.95
      seed: 42
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

  FuzzyTaskAgent:
    name: "qwen3-235b-a22b-instruct-2507"
    api_base: "Qwen3_235B_A22B_Instruct_ADDRESS_bailian"
    api_key_env: "Qwen3_235B_A22B_Instruct_API_KEY_bailian"
    max_tokens: 10240
    temperature: 0.9
    use_thinking: false
  ToolCheckAgent:
    name: "qwen3-235b-a22b-instruct-2507"
    api_base: "Qwen3_235B_A22B_Instruct_ADDRESS_bailian"
    api_key_env: "Qwen3_235B_A22B_Instruct_API_KEY_bailian"
    max_tokens: 10240
    temperature: 0.9
    use_thinking: false
  PlanTrajectoryAgent:
    name: "qwen3-235b-a22b-instruct-2507"
    api_base: "Qwen3_235B_A22B_Instruct_ADDRESS_bailian"
    api_key_env: "Qwen3_235B_A22B_Instruct_API_KEY_bailian"
    max_tokens: 10240
    temperature: 0.3
    use_thinking: false
  EvaluatePlanAgent:
    name: "qwen3-235b-a22b-instruct-2507"
    api_base: "Qwen3_235B_A22B_Instruct_ADDRESS_bailian"
    api_key_env: "Qwen3_235B_A22B_Instruct_API_KEY_bailian"
    max_tokens: 10240
    temperature: 0.2
    use_thinking: false
  ExecutePlanAgent:
    name: "qwen3-235b-a22b-instruct-2507"
    api_base: "Qwen3_235B_A22B_Instruct_ADDRESS_bailian"
    api_key_env: "Qwen3_235B_A22B_Instruct_API_KEY_bailian"
    max_tokens: 10240
    temperature: 0.9
    use_thinking: false
  MockToolAgent:
    name: "qwen3-235b-a22b-instruct-2507"
    api_base: "Qwen3_235B_A22B_Instruct_ADDRESS_bailian"
    api_key_env: "Qwen3_235B_A22B_Instruct_API_KEY_bailian"
    max_tokens: 10240
    temperature: 0.9
    use_thinking: false
  MockUserAgent:
    name: "qwen3-235b-a22b-instruct-2507"
    api_base: "Qwen3_235B_A22B_Instruct_ADDRESS_bailian"
    api_key_env: "Qwen3_235B_A22B_Instruct_API_KEY_bailian"
    max_tokens: 10240
    temperature: 0.9
    use_thinking: false
  FallbackModel:
    name: "qwen3-235b-a22b-instruct-2507"
    api_base: "Qwen3_235B_A22B_Instruct_ADDRESS_bailian"
    api_key_env: "Qwen3_235B_A22B_Instruct_API_KEY_bailian"
    max_tokens: 10240
    temperature: 0.9
    use_thinking: false

processing:
  max_workers: 1
  max_tasks: 2
  retry_failed_tasks: true
  max_plan_revisions: 5
  max_solver_turns: 18
  graph_recursion_limit: 60

retry:
  api_max_retries: 3
  api_retry_base: 1.0
  parse_max_retries: 3
  tool_call_max_retries: 3

logging:
  task_file_path: "../output/virtual_tool_use.jsonl"
  failed_task_file_path: "../output/virtual_tool_use.failed.jsonl"
  solve_path: "../output/solve_tool_use/"

evaluation:
  skip_label_match: false
  use_label_as_answer: true

input:
  question_fields: ["question", "query"]
  label_fields: ["label", "answer", "gold"]
  context_field: "context"
  id_field: "id"
  dataset_split: "test"
  legacy_persona_mode: false

paths:
  data_file: "../data/seed_qa_sample.jsonl"

# Agentic RAG 数据合成复杂度（6 步流程，4 个参数）
synthesis:
  paraphrase_supervised_question: true
  task_complexity:
    num_tools: "4~6"
  iteration_complexity:
    max_iterations: "1~2"
